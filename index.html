<html lang="de">
<head>

<title>Discord Mitgliederverlauf</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #313338;
    --bg-panel: #2b2d31;
    --bg-panel-2: #1e1f22;
    --text: #f2f3f5;
    --text-muted: #b5bac1;
    --border: #3f4147;
    --accent: #5865F2;
    --green: #23a55a;
    --red: #f23f42;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "gg sans", "Whitney", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-card .lbl { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 14px 10px;
    margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 4px; }
  .panel .hint { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }

  .chart-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .chart-toolbar button {
    background: var(--bg-panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 15px;
    cursor: pointer;
    line-height: 1.2;
  }
  .chart-toolbar button:active { background: #3a3c41; }
  .chart-toolbar .reset { font-size: 12px; }
  .chart-toolbar .zoomlvl { font-size: 11.5px; color: var(--text-muted); margin-left: auto; }

  .chart-box {
    border-radius: 6px;
    background: var(--bg-panel-2);
    touch-action: none;
  }
  .chart-box svg { display: block; width: 100%; height: auto; }

  .axis text { fill: #949ba4; font-size: 10.5px; }
  .axis path, .axis line { stroke: #3f4147; }
  .gridline { stroke: #ffffff12; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 10px 0 4px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .legend .item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink:0; }

  .tooltip {
    position: fixed;
    z-index: 50;
    background: #111214;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    max-width: 260px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
  }
  .tooltip.show { opacity: 1; transform: translateY(0); }
  .tooltip .u { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .tooltip .a-join { color: var(--green); }
  .tooltip .a-left { color: var(--red); }
  .tooltip .row { margin-top: 4px; color: var(--text-muted); }
  .tooltip .roles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tooltip .role-pill {
    font-size: 11px; padding: 2px 7px; border-radius: 10px;
    background: #ffffff14; border: 1px solid #ffffff22;
  }
  .tooltip .newacc {
    display:inline-block; margin-top:6px; padding: 2px 7px; border-radius: 10px;
    background: #fee75c22; color:#fee75c; border:1px solid #fee75c55; font-size: 11px;
  }

  .footnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; margin-top: 6px; }

  .search-wrap { position: relative; margin-bottom: 8px; }
  .search-input {
    width: 100%;
    background: var(--bg-panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13.5px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #111214;
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 30;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .search-results.show { display: block; }
  .sr-user {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .sr-user:last-child { border-bottom: none; }
  .sr-user:hover, .sr-user.expanded { background: #ffffff0a; }
  .sr-user .name { font-size: 13px; font-weight: 600; }
  .sr-user .meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .sr-events { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .sr-event {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 11.5px; padding: 4px 8px; border-radius: 5px;
    background: #ffffff08; cursor: pointer;
  }
  .sr-event:hover { background: #ffffff18; }
  .sr-event .sr-action-join { color: var(--green); }
  .sr-event .sr-action-left { color: var(--red); }
  .sr-empty { padding: 10px; font-size: 12.5px; color: var(--text-muted); }
</style>
</head>

const ROLE_LEGEND = [["Brian", "#AA0000"], ["Administrator", "#AA0000"], ["Moderator", "#843DA4"], ["Fettsack-Chaos Ü80 und Renter", "#00B4FF"], ["Social Media Team", "#D47E01"], ["Helfer", "#50B33F"], ["Geburtstag", "#EA9807"], ["Freund", "#FF7979"], ["Picasso", "#C3990A"], ["Content Creator", "#6464DF"], ["Server booster", "#F47FFF"], ["Twitch-VIP", "#B9179C"], ["Aktiv", "#EB1076"], ["Tag-User", "#17A14A"], ["Server Bot", "#277ECD"], ["Community", "#FFAA00"]];
const SUMMARY = {"total_events": 752, "total_joins": 470, "total_leaves": 282, "final_count": 140, "unique_ids": 409, "gap_count": 1, "gap_events": [{"user": "roco0092", "ts": "12.07.2024 03:36", "delta": -7}], "untracked_total": 74, "new_account_count": 32, "top_flapper": {"names": ["Just_Kiana#2184", "Kiana#2184", "Zwerg Kiana#2184"], "events": 16}, "start_ts": "20.09.2021 16:09", "end_ts": "30.08.2026 10:28"};

const monthsDE = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function fmtDate(iso) {
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  return `${dd}. ${monthsDE[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ---------- Stats cards (nur die ersten 3) ----------
const statsGrid = document.getElementById('statsGrid');
const stats = [
  {num: SUMMARY.final_count, lbl: 'Mitglieder aktuell (Ende Log)'},
  {num: SUMMARY.total_joins, lbl: 'Beitritte gesamt'},
  {num: SUMMARY.total_leaves, lbl: 'Austritte gesamt'},
];
stats.forEach(s => {
  const el = document.createElement('div');
  el.className = 'stat-card';
  el.innerHTML = `<div class="num">${s.num}</div><div class="lbl">${s.lbl}</div>`;
  statsGrid.appendChild(el);
});

document.getElementById('subtitleText').textContent =
  `${fmtDate(EVENTS[0].iso)} bis ${fmtDate(EVENTS[EVENTS.length-1].iso)} · ${EVENTS.length} geloggte Events`;

// ---------- Legend ----------
const legendEl = document.getElementById('legend');
ROLE_LEGEND.forEach(([name, color]) => {
  const item = document.createElement('div');
  item.className = 'item';
  item.innerHTML = `<span class="dot" style="background:${color}"></span>${name}`;
  legendEl.appendChild(item);
});
const noRoleItem = document.createElement('div');
noRoleItem.className = 'item';
noRoleItem.innerHTML = `<span class="dot" style="background:#99aabe"></span>Keine / unbekannte Rolle`;
legendEl.appendChild(noRoleItem);

const roleColorMap = {};
ROLE_LEGEND.forEach(([name,color]) => roleColorMap[name] = color);

// ---------- Chart (D3, zoomable) ----------
const margin = {top: 14, right: 16, bottom: 30, left: 42};
const VW = 900, VH = 460;
const width = VW - margin.left - margin.right;
const height = VH - margin.top - margin.bottom;

const svg = d3.select('#chart');
const defs = svg.append('defs');
defs.append('clipPath').attr('id', 'clip')
  .append('rect').attr('width', width).attr('height', height);

const root = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

const minDate = new Date(EVENTS[0].epoch);
const maxDate = new Date(EVENTS[EVENTS.length-1].epoch);
const maxCount = d3.max(EVENTS, e => e.count) + 5;

const xScale = d3.scaleTime().domain([minDate, maxDate]).range([0, width]);
const yScale = d3.scaleLinear().domain([0, maxCount]).range([height, 0]);

// y gridlines + axis (fixed, does not change with zoom)
const yAxisG = root.append('g').attr('class', 'axis y-axis');
yAxisG.call(d3.axisLeft(yScale).ticks(6).tickSize(-width));
yAxisG.selectAll('line').attr('class', 'gridline');
yAxisG.select('.domain').remove();

// x axis group (updated on zoom)
const xAxisG = root.append('g').attr('class', 'axis x-axis').attr('transform', `translate(0,${height})`);
xAxisG.call(d3.axisBottom(xScale).ticks(Math.max(width/85, 3)));

// plot area (clipped)
const plot = root.append('g').attr('clip-path', 'url(#clip)');

const lineGen = d3.line().x(d => xScale(d.epoch)).y(d => yScale(d.count));
const path = plot.append('path')
  .datum(EVENTS)
  .attr('d', lineGen)
  .attr('fill', 'none')
  .attr('stroke', '#5865F2')
  .attr('stroke-width', 1.6)
  .attr('opacity', 0.85);

const circles = plot.selectAll('circle').data(EVENTS).enter().append('circle')
  .attr('cx', d => xScale(d.epoch))
  .attr('cy', d => yScale(d.count))
  .attr('r', d => 3.2)
  .attr('fill', d => {
    if (d.action === 'joined') return '#23a55a';
    return d.color || '#99aabe';
  })
  .attr('stroke', d => (d.action === 'joined' && d.new_account) ? '#fee75c' : 'none')
  .attr('stroke-width', d => (d.action === 'joined' && d.new_account) ? 1.6 : 0)
  .style('cursor', 'pointer');

const tooltip = document.getElementById('tooltip');
let activeCircle = null;
function hideTooltip() {
  tooltip.classList.remove('show');
  if (activeCircle) { activeCircle.setAttribute('stroke', activeCircle.__origStroke || 'none'); activeCircle.setAttribute('stroke-width', activeCircle.__origSW || 0); }
  activeCircle = null;
}
function showTooltip(e, node, clientX, clientY) {
  if (activeCircle && activeCircle !== node) {
    activeCircle.setAttribute('stroke', activeCircle.__origStroke || 'none');
    activeCircle.setAttribute('stroke-width', activeCircle.__origSW || 0);
  }
  activeCircle = node;
  node.__origStroke = node.getAttribute('stroke');
  node.__origSW = node.getAttribute('stroke-width');
  node.setAttribute('stroke', '#ffffff');
  node.setAttribute('stroke-width', '2');

  const isJoin = e.action === 'joined';
  let html = `<div class="u">${e.user}</div>`;
  html += `<div class="${isJoin ? 'a-join' : 'a-left'}">${isJoin ? '→ ist beigetreten' : '← hat den Server verlassen'}</div>`;
  html += `<div class="row">${fmtDate(e.iso)}</div>`;
  html += `<div class="row">Mitglieder danach: <b>${e.count}</b></div>`;
  if (isJoin) {
    if (e.join_num) html += `<div class="row">${e.join_num}. Beitritt (Live-Zähler)</div>`;
    if (e.account_age) html += `<div class="row">Account-Alter beim Beitritt: ${e.account_age}</div>`;
    if (e.new_account) html += `<div class="newacc">🆕 NEW ACCOUNT beim Beitritt</div>`;
  } else {
    if (e.tenure) html += `<div class="row">War Mitglied seit: ${e.tenure}</div>`;
    if (e.roles && e.roles.length) {
      html += `<div class="roles">` + e.roles.map(r => {
        const c = roleColorMap[r] || '#99aabe';
        return `<span class="role-pill" style="border-color:${c}66;color:${c}">${r}</span>`;
      }).join('') + `</div>`;
    }
  }
  tooltip.innerHTML = html;
  tooltip.classList.add('show');

  const tw = 260, th = tooltip.offsetHeight || 120;
  let left = clientX + 14, top = clientY - th/2;
  if (left + tw > window.innerWidth - 8) left = clientX - tw - 14;
  if (top < 8) top = 8;
  if (top + th > window.innerHeight - 8) top = window.innerHeight - th - 8;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

circles.on('click', function(event, d) {
  event.stopPropagation();
  showTooltip(d, this, event.clientX, event.clientY);
});

document.body.addEventListener('click', () => hideTooltip());

// ---------- Zoom behaviour ----------
const zoomLvlEl = document.getElementById('zoomLvl');

const zoom = d3.zoom()
  .scaleExtent([1, 3000])
  .translateExtent([[0, 0], [width, height]])
  .extent([[0, 0], [width, height]])
  .on('zoom', zoomed)
  .on('start', () => hideTooltip());

svg.call(zoom);

function zoomed(event) {
  const t = event.transform;
  const newX = t.rescaleX(xScale);
  xAxisG.call(d3.axisBottom(newX).ticks(Math.max(width/85, 3)));
  path.attr('d', d3.line().x(d => newX(d.epoch)).y(d => yScale(d.count)));
  circles.attr('cx', d => newX(d.epoch));
  zoomLvlEl.textContent = `Zoom: ${t.k.toFixed(1)}×`;
}
zoomLvlEl.textContent = 'Zoom: 1.0×';

document.getElementById('zoomIn').addEventListener('click', () => {
  svg.transition().duration(200).call(zoom.scaleBy, 1.8);
});
document.getElementById('zoomOut').addEventListener('click', () => {
  svg.transition().duration(200).call(zoom.scaleBy, 1/1.8);
});
document.getElementById('zoomReset').addEventListener('click', () => {
  svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
});


// ---------- Fuzzy-Suche nach Nutzern ----------
const circleNodes = circles.nodes(); // index-parallel zu EVENTS

// Nutzer nach Discord-ID gruppieren (ein Mensch kann mehrere Usernamen über die Jahre gehabt haben)
const userGroups = new Map();
EVENTS.forEach((e, idx) => {
  if (!userGroups.has(e.id)) userGroups.set(e.id, { id: e.id, names: new Set(), eventIdx: [] });
  const g = userGroups.get(e.id);
  g.names.add(e.user);
  g.eventIdx.push(idx);
});
const userList = Array.from(userGroups.values());

// simple fuzzy subsequence score: alle Query-Zeichen müssen in Reihenfolge vorkommen,
// zusammenhängende Treffer und Wortanfänge werden stärker gewichtet -> tippfehlertolerant genug
// für "kommt in die Nähe" statt exaktem Match.
function fuzzyScore(query, target) {
  query = query.toLowerCase();
  target = target.toLowerCase();
  if (!query) return -1;
  let qi = 0, score = 0, consecutive = 0;
  for (let ti = 0; ti < target.length && qi < query.length; ti++) {
    if (target[ti] === query[qi]) {
      score += 1 + consecutive * 2;
      if (ti === 0 || /[^a-z0-9]/.test(target[ti - 1])) score += 3; // Wortanfang-Bonus
      consecutive++;
      qi++;
    } else {
      consecutive = 0;
    }
  }
  if (qi < query.length) return -1; // nicht alle Zeichen gefunden -> kein Treffer
  if (target.includes(query)) score += 15; // Bonus für zusammenhängenden Substring
  return score;
}

function bestNameScore(query, names) {
  let best = -1;
  names.forEach(n => { const s = fuzzyScore(query, n); if (s > best) best = s; });
  return best;
}

const searchInput = document.getElementById('userSearch');
const searchResults = document.getElementById('searchResults');

function renderResults(query) {
  const scored = userList
    .map(g => ({ g, score: bestNameScore(query, g.names) }))
    .filter(x => x.score >= 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);

  searchResults.innerHTML = '';
  if (scored.length === 0) {
    searchResults.innerHTML = '<div class="sr-empty">Keine Treffer</div>';
    searchResults.classList.add('show');
    return;
  }

  scored.forEach(({ g }) => {
    const row = document.createElement('div');
    row.className = 'sr-user';
    const namesStr = Array.from(g.names).join(' / ');
    const n = g.eventIdx.length;
    row.innerHTML = `<div class="name">${namesStr}</div><div class="meta">${n} Event${n === 1 ? '' : 's'} im Log</div>`;

    const evWrap = document.createElement('div');
    evWrap.className = 'sr-events';
    evWrap.style.display = 'none';

    const sortedIdx = [...g.eventIdx].sort((a, b) => EVENTS[a].epoch - EVENTS[b].epoch);
    sortedIdx.forEach(idx => {
      const e = EVENTS[idx];
      const er = document.createElement('div');
      er.className = 'sr-event';
      const isJoin = e.action === 'joined';
      er.innerHTML = `<span>${e.user}</span><span class="${isJoin ? 'sr-action-join' : 'sr-action-left'}">${isJoin ? 'Beitritt' : 'Austritt'} · ${fmtDate(e.iso)}</span>`;
      er.addEventListener('click', (ev) => {
        ev.stopPropagation();
        jumpToEvent(idx);
        searchResults.classList.remove('show');
        searchInput.value = namesStr;
      });
      evWrap.appendChild(er);
    });

    row.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const isOpen = evWrap.style.display !== 'none';
      searchResults.querySelectorAll('.sr-events').forEach(el => el.style.display = 'none');
      searchResults.querySelectorAll('.sr-user').forEach(el => el.classList.remove('expanded'));
      if (!isOpen) {
        evWrap.style.display = 'flex';
        row.classList.add('expanded');
        // bei nur einem Event direkt hinspringen
        if (sortedIdx.length === 1) {
          jumpToEvent(sortedIdx[0]);
        }
      }
    });

    row.appendChild(evWrap);
    searchResults.appendChild(row);
  });
  searchResults.classList.add('show');
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) { searchResults.classList.remove('show'); return; }
  renderResults(q);
});
searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) searchResults.classList.add('show');
});
document.body.addEventListener('click', (ev) => {
  if (!document.getElementById('searchWrap').contains(ev.target)) {
    searchResults.classList.remove('show');
  }
});

function jumpToEvent(idx) {
  const e = EVENTS[idx];
  const currentT = d3.zoomTransform(svg.node());
  const targetK = Math.max(currentT.k, 15);
  const px = xScale(e.epoch);
  const tx = width / 2 - targetK * px;
  const newTransform = d3.zoomIdentity.translate(tx, 0).scale(targetK);
  svg.transition().duration(500).call(zoom.transform, newTransform)
    .on('end', () => {
      const node = circleNodes[idx];
      const rect = node.getBoundingClientRect();
      showTooltip(e, node, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
}
